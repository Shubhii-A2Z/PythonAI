[project]
name = "pythonaiconcepts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "negishubham2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.4",
    "langchain-huggingface>=1.2.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
pythonaiconcepts = "pythonaiconcepts:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
